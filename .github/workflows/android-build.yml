name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'    # 请替换为你的 Flutter 版本号，例如 '3.22.0'

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup JDK 17
        uses: actions/setup-java@v4        # 使用 v4 替代已弃用的 v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3   # 自动安装 Gradle，无需 gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace
