name: Build PiliPlus APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'   # 项目所需版本
          channel: 'stable'

      - name: Fix pubspec.yaml
        run: |
          # 修正环境约束
          sed -i 's/sdk: ">=3\.13\.0"/sdk: ">=3.7.0"/g' pubspec.yaml
          sed -i 's/flutter: 3\.47\.[0-9]*/flutter: ">=3.0.0"/g' pubspec.yaml

          # 降级 flutter_lints
          sed -i 's/flutter_lints: \^6\.0\.0/flutter_lints: ^5.0.0/g' pubspec.yaml

          # ⚠️ 不再修改 vector_math，保持项目原有的 ^2.2.0

          # 添加 dependency_overrides（仅处理 win32, material_color_utilities, json_annotation）
          if grep -q "^dependency_overrides:" pubspec.yaml; then
            for pkg in win32 material_color_utilities json_annotation; do
              case $pkg in
                win32) ver="5.13.0" ;;
                material_color_utilities) ver="0.11.1" ;;
                json_annotation) ver="4.9.0" ;;
              esac
              if grep -q "$pkg:" pubspec.yaml; then
                sed -i "s/$pkg:.*/$pkg: $ver/g" pubspec.yaml
              else
                sed -i "/^dependency_overrides:/a\  $pkg: $ver" pubspec.yaml
              fi
            done
          else
            cat >> pubspec.yaml << EOF

          dependency_overrides:
            win32: 5.13.0
            material_color_utilities: 0.11.1
            json_annotation: 4.9.0
          EOF
          fi

          echo "🔧 Modified pubspec.yaml:"
          grep -E "sdk:|flutter:|flutter_lints:|win32:|material_color_utilities:|json_annotation:" pubspec.yaml || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-APK
          path: build/app/outputs/flutter-apk/app-release.apk